[project]
name = "rbrs"
version = "0.1.0"
description = "Rule-based reasoning system for SME decarbonisation recommendations (research prototype)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "krippendorff>=0.8.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
rbrs = "rbrs.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["rbrs"]
omit = ["src/rbrs/cli.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E701", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["rbrs"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["krippendorff", "pymupdf", "scipy.*", "yaml", "pandas"]
ignore_missing_imports = true
